
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JavaScript Events</title>
</head>
<body>
    <header>
        <h1>JavaScript Events</h1>

        <nav>
            <a href="index.html">Introduction</a>
            <a href="dom.html">DOM Manipulation</a>
            <a href="events.html">Events</a>
            <a href="todo.html">To-Do List</a>
        </nav>

    <main>
        <h2>Part 3. Events</h2>

        <section>
            <h3>Task 5. Mouse Events</h3>
            <div id="mouseBox">Move your mouse here</div>
        </section>

        <section>
            <h3>Task 6. Keyboard Events</h3>
            <input type="text" id="keyboardInput" placeholder="Type something">
            <p id="keyboardOutput"></p>
        </section>

        <section>
            <h3>Task 7. Calculator</h3>

            <input type="number" id="num1" placeholder="First number">
            <input type="number" id="num2" placeholder="Second number">

            <p>
                <button id="add">+</button>
                <button id="subtract">-</button>
                <button id="multiply">*</button>
                <button id="divide">/</button>
            </p>

            <p id="result">Result:</p>
        </section>
    </main>

    <script src="events.js"></script>
</body>
